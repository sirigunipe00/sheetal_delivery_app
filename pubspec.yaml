name: sheetal_driver_app
description: "Sheetal delivery partner app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.9.0
  geolocator: ^14.1.2
  geocoding: ^5.0.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.1.0
  image_picker: ^1.2.0
  flutter_local_notifications: ^19.4.0
  flutter_ringtone_player_plus: ^1.0.0
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans.ttf

flutter_launcher_icons:
    android: true
    ios: true
    image_path: "assets/images/logo_main.png"